<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kam Chai Nabirsa</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1E293B;
        --text: #F8FAFC;
        --text-muted: #94A3B8;
        --border: #334155;
      }
    }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      background-color: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .title {
      font-weight: 600;
      font-size: 15px;
    }
    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }
    .card {
      background: rgba(79, 70, 229, 0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .hint {
      color: var(--text-muted);
      font-size: 12px;
      margin: 0 0 8px 0;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background-color: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon32.png" alt="Logo" class="logo">
    <div>
      <div class="title">Kam Chai Nabirsa</div>
      <div class="subtitle">Don't forget your work</div>
    </div>
  </div>

  <div class="card">
    <p class="hint">The floating widget is active on all web pages. Look for the small pill icon on the edge of your screen.</p>
    <p class="hint" style="font-size: 11px;">Note: Chrome does not allow extensions to run on internal <code>chrome://</code> pages or the Web Store.</p>
  </div>

  <button id="reset-pos-btn" class="btn btn-secondary">Reset Widget Position</button>

  <script src="popup.js"></script>
</body>
</html>
