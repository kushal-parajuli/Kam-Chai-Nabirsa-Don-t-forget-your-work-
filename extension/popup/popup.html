<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kam Chai Nabirsa</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1E293B;
        --text: #F8FAFC;
        --text-muted: #94A3B8;
        --border: #334155;
      }
    }
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      background-color: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .title {
      font-weight: 600;
      font-size: 15px;
    }
    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }
    .toggle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(79, 70, 229, 0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .toggle-label {
      font-weight: 500;
      font-size: 13px;
    }
    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #CBD5E1;
      transition: 0.2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--primary);
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .card {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .hint {
      color: var(--text-muted);
      font-size: 12px;
      margin: 0;
      line-height: 1.45;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background-color: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s ease;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .footer-copy {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon32.png" alt="Logo" class="logo">
    <div>
      <div class="title">Kam Chai Nabirsa</div>
      <div class="subtitle">Don't forget your work</div>
    </div>
  </div>

  <div class="toggle-card">
    <span class="toggle-label">Show floating widget</span>
    <label class="switch" title="Toggle floating widget on all pages">
      <input type="checkbox" id="widget-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="card">
    <p class="hint">The floating widget is active on all web pages. Click the pill icon to open the panel.</p>
  </div>

  <div class="btn-group">
    <button id="reset-pos-btn" class="btn btn-secondary">Reset Widget Position</button>
    <button id="test-sound-btn" class="btn btn-secondary">Test Alarm Sound (3s)</button>
  </div>

  <div class="footer-copy">© 2026 Kushal Parajuli</div>

  <script src="popup.js"></script>
</body>
</html>
